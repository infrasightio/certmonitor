# InfraSight - full stack.
#
#   docker compose up -d          start everything
#   docker compose logs -f        follow logs
#   docker compose ps             service status
#   docker compose restart worker restart just the worker
#   docker compose down           stop (volumes are preserved)
#
# The API and the worker run the same image with different entrypoint roles,
# so they can never disagree about check semantics or the schema.

# Overridable so an existing CertMonitor deployment can pin the old project
# name and keep pointing at its existing postgres volume. See .env.example.
name: ${COMPOSE_PROJECT_NAME:-infrasight}

services:
  # ------------------------------------------------------------ database
  postgres:
    image: postgres:16-alpine
    container_name: infrasight-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-infrasight}
      POSTGRES_USER: ${POSTGRES_USER:-infrasight}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      # Fail fast on a misconfigured locale rather than silently producing a
      # cluster with unexpected collation.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C"
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      # Named volume: monitoring history must survive `docker compose down`
      # and any container rebuild.
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-infrasight} -d ${POSTGRES_DB:-infrasight}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Only exposed on loopback, and only so an operator can run psql or take
    # a backup from the host. Comment this out to close it entirely.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    networks:
      - infrasight
    stop_grace_period: 30s
    command:
      - postgres
      - -c
      - max_connections=200
      - -c
      - shared_buffers=256MB
      - -c
      - effective_cache_size=768MB
      - -c
      - work_mem=8MB
      # Log anything slower than a second: the statistics queries are the
      # first thing to degrade as history grows.
      - -c
      - log_min_duration_statement=1000

  # --------------------------------------------------------------- redis
  redis:
    image: redis:7-alpine
    container_name: infrasight-redis
    restart: unless-stopped
    # Used for cross-replica login rate limiting and import previews. The
    # application degrades to in-process equivalents if Redis is absent, so
    # this service is a hardening measure rather than a hard dependency.
    command:
      - redis-server
      - --appendonly
      - "no"
      - --save
      - ""
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - infrasight

  # -------------------------------------------------------- vantage exits
  #
  # Three SOCKS proxies, each exiting in a different country, so the worker can
  # re-check a failing endpoint from somewhere other than this host's own egress.
  # Free, and no second VM.
  #
  # Tor is the cheapest way to get genuinely different network positions from a
  # single box. It is also slow, rate-limited, and routinely blocked by WAFs and
  # CDNs - which is why a vantage verdict in this product can only ever WITHHOLD
  # an incident and never open one, and why a blocked or timed-out exit counts
  # as "no opinion" rather than as agreement. See app/services/vantage_service.
  #
  # StrictNodes 0 on purpose: when no exit is available in the requested
  # country Tor picks another rather than failing, and a check from the wrong
  # country is still a check from somewhere that is not this VM.
  #
  # Swap this for gluetun, or any VPN container that exposes SOCKS, by pointing
  # VANTAGE_POINTS at it instead. Nothing in the application knows what is
  # behind the proxy.
  #
  # Remove this service and unset VANTAGE_POINTS to turn the whole thing off:
  # with no vantages configured the worker behaves exactly as it did before.
  #
  # One container per exit country, NOT one container with three ports:
  # `ExitNodes` is a global torrc directive, so several SocksPorts on one
  # instance would all leave through the same country and give you three
  # circuits to one place rather than three places. About 40 MB of RAM each.
  #
  # Ports are not published to the host - only the worker on the internal
  # network needs them, and a reachable SOCKS port is an open relay.
  tor-de: &tor
    image: dperson/torproxy:latest
    restart: unless-stopped
    command: >
      sh -c "mkdir -p /tmp/tor && printf '%s\n'
      'SocksPort 0.0.0.0:9050'
      'DataDirectory /tmp/tor'
      'ExitNodes {de}'
      'StrictNodes 0'
      > /tmp/torrc && exec tor -f /tmp/torrc"
    expose:
      - "9050"
    networks:
      - infrasight

  tor-us:
    <<: *tor
    command: >
      sh -c "mkdir -p /tmp/tor && printf '%s\n'
      'SocksPort 0.0.0.0:9050'
      'DataDirectory /tmp/tor'
      'ExitNodes {us}'
      'StrictNodes 0'
      > /tmp/torrc && exec tor -f /tmp/torrc"

  tor-sg:
    <<: *tor
    command: >
      sh -c "mkdir -p /tmp/tor && printf '%s\n'
      'SocksPort 0.0.0.0:9050'
      'DataDirectory /tmp/tor'
      'ExitNodes {sg}'
      'StrictNodes 0'
      > /tmp/torrc && exec tor -f /tmp/torrc"

  # ----------------------------------------------------------- API layer
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: infrasight/backend:${IMAGE_TAG:-latest}
    container_name: infrasight-backend
    restart: unless-stopped
    command: ["api"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-infrasight}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-infrasight}
      REDIS_URL: redis://redis:6379/0
      API_WORKERS: ${API_WORKERS:-2}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8000/live"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - infrasight
    # Give uvicorn time to finish in-flight requests on SIGTERM.
    stop_grace_period: 30s

  # ------------------------------------------------------ monitoring worker
  worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: infrasight/backend:${IMAGE_TAG:-latest}
    restart: unless-stopped
    # Deliberately NO container_name and NO hostname here. Both are
    # single-instance settings: Docker refuses to scale a service that pins a
    # container name, and a pinned hostname would give every replica the same
    # worker id, collapsing three workers into one heartbeat row.
    #
    #   docker compose up -d --scale worker=3
    #
    # Each replica therefore takes its container ID as its worker id. That id
    # changes when a container is replaced, which is fine: the worker deletes
    # its own heartbeat row on clean shutdown, and any row left by a hard kill
    # is retired by the next worker's startup sweep.
    command: ["worker"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-infrasight}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-infrasight}
      REDIS_URL: redis://redis:6379/0
      WORKER_ENABLED: "true"
      # A smaller pool than the API: the worker holds one short transaction
      # per check, not one per request.
      DB_POOL_SIZE: ${WORKER_DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${WORKER_DB_MAX_OVERFLOW:-10}
      # Shown on each worker card in System Resources. Note that `--scale
      # worker=3` gives every replica the SAME value, because they share this
      # environment - which is correct when the replicas are on one box. To
      # label workers that genuinely sit in different places, run them as
      # separate services (or separate Compose files) with a WORKER_REGION
      # each; in Kubernetes, take it from the node's topology label.
      WORKER_REGION: ${WORKER_REGION:-}
    depends_on:
      postgres:
        condition: service_healthy
      # The API applies migrations; the worker waits for the schema in its
      # entrypoint, so this only orders startup.
      backend:
        condition: service_started
    healthcheck:
      # The worker exposes no HTTP port. Liveness is the process being up
      # plus the heartbeat rows the API reports through /health.
      test: ["CMD-SHELL", "pgrep -f monitor_worker > /dev/null || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 40s
    networks:
      - infrasight
    # Long enough for in-flight checks to finish and leases to be released.
    stop_grace_period: 45s

  # ------------------------------------------------------------ frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    image: infrasight/frontend:${IMAGE_TAG:-latest}
    container_name: infrasight-frontend
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks:
      - infrasight

volumes:
  postgres_data:
    driver: local

networks:
  infrasight:
    driver: bridge
