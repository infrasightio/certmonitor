# nginx serves the built SPA and proxies the API.
#
# `backend` is the Compose service name; Docker's embedded DNS resolves it.

upstream infrasight_api {
    server backend:8000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The API already returns JSON error bodies; do not let nginx replace
    # them with its own HTML error pages.
    proxy_intercept_errors off;

    client_max_body_size 12m;   # must exceed MAX_UPLOAD_BYTES for imports

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        image/svg+xml;

    # ------------------------------------------------ security headers
    # Any location below that sets its own add_header must include this file
    # again - nginx drops inherited headers the moment a location adds one.
    include /etc/nginx/snippets/security-headers.conf;

    # ------------------------------------------------------ own health
    location = /healthz {
        access_log off;
        # `default_type`, not `add_header Content-Type` - setting any header
        # here would drop the inherited security headers for this location.
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---------------------------------------------------------- API
    location /api/ {
        proxy_pass http://infrasight_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # The audit log records the client address from this header.
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;

        proxy_connect_timeout 10s;
        proxy_send_timeout 120s;
        # Manual checks and large imports can legitimately take a while.
        proxy_read_timeout 120s;
        proxy_buffering off;
    }

    # Probes are proxied so an external monitor can reach them through the
    # single published port. Branding rides along because it is the other
    # unauthenticated, root-mounted route: the sign-in screen reads it before
    # there is a session, so it cannot go through /api/ auth. The optional
    # /logo suffix matters - the anchored pattern would otherwise 404 the
    # image itself.
    location ~ ^/(health|ready|live)$|^/branding(/logo)?$ {
        access_log off;
        proxy_pass http://infrasight_api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    # ------------------------------------------------------- assets
    # Vite emits content-hashed filenames, so these can be cached hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri =404;
    }

    # ---------------------------------------------------------- docs
    # The documentation site, copied into the image from docs/. A separate
    # static site with its own shell, not part of the SPA, so it gets its own
    # fallback - and a missing asset under it must 404 rather than silently
    # returning the docs index.
    #
    # Nothing here is content-hashed the way Vite's output is, so every file
    # is revalidated instead of cached hard: the docs change whenever the
    # image does, and a stale app.js beside a fresh index.html would be a real
    # bug rather than a cosmetic one. 304s make that cheap.
    location /docs/ {
        add_header Cache-Control "no-cache" always;
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /docs/index.html;
    }

    # Bare /docs, so a typed or pasted URL without the slash still lands.
    location = /docs {
        return 301 /docs/;
    }

    # ------------------------------------------------- SPA fallback
    location / {
        # index.html must never be cached, or a deploy leaves clients on the
        # old asset manifest.
        add_header Cache-Control "no-store, must-revalidate" always;
        # Required: the line above would otherwise drop every inherited
        # security header, serving the application shell itself with no CSP.
        include /etc/nginx/snippets/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
