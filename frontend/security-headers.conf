# Security headers, defined once and included wherever they are needed.
#
# This file exists because of an nginx rule that is easy to get wrong: a
# `location` block that sets ANY `add_header` stops inheriting every
# `add_header` from its parent. So a location that only wants to add a
# Cache-Control silently loses the whole security posture unless it restates
# it. Restating it by hand in several places is how a CSP drifts out of step
# with itself, so it lives here instead.
#
# `always` on each one so the headers are sent on error responses too, not
# only on 2xx/3xx.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;

# The SPA and the documentation site are both self-contained: no external
# scripts, styles, fonts or images, and they talk only to their own origin.
# The documentation deliberately loads no webfont for exactly this reason -
# see docs/assets/styles.css.
#
# `blob:` in img-src is not a loosening - a blob URL can only ever point at
# bytes this page already holds in memory. The capture screenshots need it:
# their API route authenticates with a bearer header, which an <img src>
# request would not carry, so the SPA fetches the JPEG with axios and renders
# it through URL.createObjectURL (see src/components/CapturePanel.jsx). Drop
# `blob:` and the fetch still succeeds while every screenshot renders broken.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
